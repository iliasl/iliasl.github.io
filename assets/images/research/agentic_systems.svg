<svg width="440" height="280" viewBox="0 0 440 280" xmlns="http://www.w3.org/2000/svg">
  <rect width="440" height="280" fill="#f8f9fa"/>
  <circle cx="220" cy="140" r="80" fill="#e9ecef"/>
  
  <!-- Loop/Agent Cycle -->
  <path d="M 220 70 A 70 70 0 1 1 219 70" fill="none" stroke="#204a87" stroke-width="4" stroke-dasharray="10 5" opacity="0.4"/>
  
  <circle cx="220" cy="70" r="15" fill="#204a87"/>
  <circle cx="290" cy="140" r="15" fill="#204a87" opacity="0.6"/>
  <circle cx="220" cy="210" r="15" fill="#204a87" opacity="0.4"/>
  <circle cx="150" cy="140" r="15" fill="#204a87" opacity="0.6"/>
  
  <!-- Arrows -->
  <path d="M 240 70 L 270 110" stroke="#204a87" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#204a87" />
    </marker>
  </defs>

  <text x="220" y="240" font-family="Arial, sans-serif" font-size="18" fill="#204a87" text-anchor="middle" font-weight="bold">Agentic Systems</text>
</svg>
